# Build an edk2-msm UEFI image for Redmi K30 Pro (lmi / lmipro, SM8250).
# Intended to be placed at .github/workflows/build_lmi.yml in a fork of
# edk2-porting/edk2-msm, then triggered with workflow_dispatch on master.
name: Build lmi UEFI

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build:
    name: Build boot-lmi.img
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          # The runner image runs unattended-upgrades on boot, which holds the
          # dpkg lock; apt then waits on it forever and the step looks "stuck".
          sudo systemctl stop unattended-upgrades 2>/dev/null || true
          sudo systemctl disable unattended-upgrades 2>/dev/null || true
          sudo pkill -9 -f unattended-upgrade 2>/dev/null || true
          sudo pkill -9 -f apt.systemd.daily 2>/dev/null || true
          sleep 3
          sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock \
                     /var/cache/apt/archives/lock 2>/dev/null || true
          sudo dpkg --configure -a || true

          PKGS="build-essential uuid-dev iasl git nasm python-is-python3 python3-pil python3-git gettext clang llvm lld gcc-aarch64-linux-gnu device-tree-compiler abootimg libssl-dev dosfstools zip"
          APTOPTS="-y -o DPkg::Lock::Timeout=180 -o Acquire::Retries=3 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25"
          if sudo apt-get install $APTOPTS $PKGS; then
            echo "installed from cached index"
          else
            echo "refreshing index"
            sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=25 || true
            sudo apt-get install $APTOPTS $PKGS
          fi
          echo "--- tool check ---"
          which iasl nasm dtc clang python3 git

      - name: Build UEFI image for lmi
        run: |
          set -o pipefail
          ./build.sh --device lmi 2>&1 | tee build.log

      - name: Collect produced images
        if: always()
        run: |
          mkdir -p out
          echo "--- all built images ---"
          find . -maxdepth 6 \( -name '*.img' -o -name '*.fd' \) \
            -printf '%p %s bytes\n' | head -60 | tee image-list.txt
          find . -maxdepth 6 \( -name '*.img' -o -name '*.fd' \) \
            -size +100k -exec cp -v {} out/ \; 2>/dev/null || true
          cp -v build.log out/ 2>/dev/null || true
          cp -v image-list.txt out/ 2>/dev/null || true
          echo "--- out ---"
          ls -lh out/

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-lmi
          path: out/
          if-no-files-found: warn
          retention-days: 30
