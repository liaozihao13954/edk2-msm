# Build an edk2-msm UEFI image for Redmi K30 Pro (lmi / lmipro, SM8250).
# Intended to be placed at .github/workflows/build_lmi.yml in a fork of
# edk2-porting/edk2-msm, then triggered with workflow_dispatch on master.
#
# NOTE: apt on the hosted runner stopped working (archive.ubuntu.com
# unreachable -> apt hangs indefinitely), so the whole build runs inside
# TianoCore's own CI container, which already ships iasl / nasm / clang /
# lld / dtc / uuid-dev. No apt step at all.
name: Build lmi UEFI

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build:
    name: Build boot-lmi.img
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    container:
      image: ghcr.io/tianocore/containers/ubuntu-22-dev:latest
      options: --user root
    steps:
      - name: Tool check
        shell: bash
        run: |
          # running as root inside the container: without this, git refuses to
          # operate on the mounted workspace ("dubious ownership")
          git config --global --add safe.directory '*'
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          # edk2 scripts sometimes call bare `python`
          command -v python >/dev/null 2>&1 || ln -sf "$(command -v python3)" /usr/local/bin/python
          # gettext's msgfmt is missing from this image; build.sh only uses it to
          # emit SimpleInit locale .mo files, so a placeholder is enough.
          if ! command -v msgfmt >/dev/null 2>&1; then
            printf '#!/bin/sh\nout=""\nwhile [ $# -gt 0 ]; do if [ "$1" = "-o" ]; then out="$2"; shift 2; else shift; fi; done\n[ -n "$out" ] && : > "$out"\nexit 0\n' > /usr/local/bin/msgfmt
            chmod +x /usr/local/bin/msgfmt
            echo "installed msgfmt shim"
          fi
          echo "--- preinstalled toolchain ---"
          for t in iasl nasm clang lld ld.lld dtc msgfmt python3 python git make zip; do
            printf '%-10s ' "$t"; command -v $t || echo "(missing)"
          done

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Build UEFI image for lmi
        shell: bash
        run: |
          set -o pipefail
          # --acpi is REQUIRED: GEN_ACPI defaults to false and build.sh then
          # reuses the prebuilt DSDT.aml, silently ignoring every .asl edit.
          # lmi.conf sets SPLIT_DSDT=true / USE_IASL=true, so this makes the
          # build run `iasl -ve Dsdt.asl` and pick up our extra devices.
          ./build.sh --device lmi --acpi 2>&1 | tee build.log

      - name: Collect produced images
        if: always()
        shell: bash
        run: |
          mkdir -p out
          echo "--- all built images ---"
          find . -maxdepth 6 \( -name '*.img' -o -name '*.fd' \) \
            -printf '%p %s bytes\n' | head -60 | tee image-list.txt
          find . -maxdepth 6 \( -name '*.img' -o -name '*.fd' \) \
            -size +100k -exec cp -v {} out/ \; 2>/dev/null || true
          cp -v build.log out/ 2>/dev/null || true
          cp -v image-list.txt out/ 2>/dev/null || true
          echo "--- out ---"
          ls -lh out/

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-lmi
          path: out/
          if-no-files-found: warn
          retention-days: 30
